<!doctype html>
<!-- Dev tool: composes public/og.png from the real renderer. See tools/README in the main README. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4efe6; }
      body { position: relative; font-family: 'Geist', sans-serif; color: #231d18; }
      .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
      .mark { display: flex; align-items: center; gap: 14px; font: 400 76px/1 'Instrument Serif', serif; letter-spacing: -0.01em; }
      .mark em { color: #e8452c; }
      .mark img { width: 58px; height: 58px; }
      p { margin: 0; font-size: 29px; line-height: 1.3; font-weight: 500; color: #4a4038; }
      .tags { display: flex; gap: 10px; flex-wrap: wrap; }
      .tags span { font-size: 18px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #ebe3d6; color: #4a4038; }
      canvas { position: absolute; left: 540px; top: 50%; translate: 0 -50%; width: 760px; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="mark"><img src="../public/icons/icon.svg" alt="" />Frame<em>smith</em></div>
      <p>Beautiful screenshots in seconds. Free, private, right in your browser.</p>
      <div class="tags"><span>Backgrounds</span><span>3D tilt</span><span>Annotate</span><span>Redact</span></div>
    </div>
    <canvas id="c"></canvas>
    <script type="module">
      import { render, computeLayout } from '../public/js/render.js';
      import { demoShot, demoAnnotations } from '../public/js/demo.js';
      await document.fonts.load('600 20px Geist');
      await document.fonts.load('76px "Instrument Serif"');
      const shot = demoShot();
      const s = { bitmap: shot, sx: 0, sy: 0, w: shot.width, h: shot.height };
      const style = { bg: { kind: 'mesh', id: 'peach' }, grain: false, frame: 'mac-light', frameTitle: '', aspect: '4:3', padding: 8, radius: 14, shadow: 60, tilt: 18 };
      const L = computeLayout(s.w, s.h, style);
      const c = document.getElementById('c');
      const k = 1520 / L.W;
      c.width = L.W * k;
      c.height = L.H * k;
      render(c.getContext('2d'), { style, annotations: demoAnnotations() }, s, new Map(), { s: k });
      c.style.borderRadius = '28px 0 0 28px';
      document.title = 'ready';
    </script>
  </body>
</html>
